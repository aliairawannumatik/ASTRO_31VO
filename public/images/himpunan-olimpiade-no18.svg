<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" width="760" height="402" font-family="Arial, sans-serif" font-size="15">

  <!-- Background -->
  <rect width="760" height="402" fill="white"/>

  <!-- Outer border -->
  <rect x="1" y="1" width="758" height="400" fill="none" stroke="#222" stroke-width="1.5"/>

  <!-- Column widths: No=55, Jenis=385, Banyak=318 -->

  <!-- Header row background -->
  <rect x="1" y="1" width="758" height="46" fill="white"/>

  <!-- Header text -->
  <text x="28" y="28" font-weight="bold" text-anchor="middle" dominant-baseline="middle" dy="5">No.</text>
  <text x="248" y="28" font-weight="bold" text-anchor="middle" dominant-baseline="middle" dy="5">Jenis Kerusakan</text>
  <text x="599" y="28" font-weight="bold" text-anchor="middle" dominant-baseline="middle" dy="5">Banyak Baterai yang Rusak</text>

  <!-- Header bottom border -->
  <line x1="1" y1="47" x2="759" y2="47" stroke="#222" stroke-width="1.5"/>

  <!-- Row 1 -->
  <text x="28" y="78" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="100" y="78" dominant-baseline="middle">Pelat penutup</text>
  <text x="599" y="78" text-anchor="middle" dominant-baseline="middle">30</text>
  <line x1="1" y1="101" x2="759" y2="101" stroke="#222" stroke-width="1"/>

  <!-- Row 2 -->
  <text x="28" y="128" text-anchor="middle" dominant-baseline="middle">2</text>
  <text x="100" y="128" dominant-baseline="middle">Elektrolit</text>
  <text x="599" y="128" text-anchor="middle" dominant-baseline="middle">50</text>
  <line x1="1" y1="151" x2="759" y2="151" stroke="#222" stroke-width="1"/>

  <!-- Row 3 -->
  <text x="28" y="178" text-anchor="middle" dominant-baseline="middle">3</text>
  <text x="100" y="178" dominant-baseline="middle">Terminal</text>
  <text x="599" y="178" text-anchor="middle" dominant-baseline="middle">40</text>
  <line x1="1" y1="201" x2="759" y2="201" stroke="#222" stroke-width="1"/>

  <!-- Row 4 -->
  <text x="28" y="228" text-anchor="middle" dominant-baseline="middle">4</text>
  <text x="100" y="228" dominant-baseline="middle">Terminal dan Pelat Penutup</text>
  <text x="599" y="228" text-anchor="middle" dominant-baseline="middle">10</text>
  <line x1="1" y1="251" x2="759" y2="251" stroke="#222" stroke-width="1"/>

  <!-- Row 5 -->
  <text x="28" y="278" text-anchor="middle" dominant-baseline="middle">5</text>
  <text x="100" y="278" dominant-baseline="middle">Pelat Penutup dan Elektrolit</text>
  <text x="599" y="278" text-anchor="middle" dominant-baseline="middle">19</text>
  <line x1="1" y1="301" x2="759" y2="301" stroke="#222" stroke-width="1"/>

  <!-- Row 6 -->
  <text x="28" y="328" text-anchor="middle" dominant-baseline="middle">6</text>
  <text x="100" y="328" dominant-baseline="middle">Terminal dan Elektrolit</text>
  <text x="599" y="328" text-anchor="middle" dominant-baseline="middle">15</text>
  <line x1="1" y1="351" x2="759" y2="351" stroke="#222" stroke-width="1"/>

  <!-- Row 7 (two lines) -->
  <text x="28" y="370" text-anchor="middle" dominant-baseline="middle">7</text>
  <text x="100" y="362" dominant-baseline="middle">Pelat Penutup, Elektrolit</text>
  <text x="100" y="385" dominant-baseline="middle">dan Terminal</text>
  <text x="599" y="370" text-anchor="middle" dominant-baseline="middle">5</text>

  <!-- Vertical lines -->
  <line x1="55" y1="1" x2="55" y2="401" stroke="#222" stroke-width="1.5"/>
  <line x1="440" y1="1" x2="440" y2="401" stroke="#222" stroke-width="1.5"/>

</svg>
